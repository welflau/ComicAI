version: "3.9"

services:
  # ─────────────── Backend API ───────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comicflow-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://comicflow:comicflow123@postgres:5432/comicflow
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - SECRET_KEY=comicflow-super-secret-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────── Celery Worker ───────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comicflow-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://comicflow:comicflow123@postgres:5432/comicflow
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.worker worker --loglevel=info --concurrency=4

  # ─────────────── Celery Beat (scheduler) ───────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comicflow-beat
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.worker beat --loglevel=info

  # ─────────────── Flower (task monitor) ───────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comicflow-flower
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.tasks.worker flower --port=5555

  # ─────────────── Frontend ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comicflow-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000

  # ─────────────── PostgreSQL ───────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: comicflow-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=comicflow
      - POSTGRES_PASSWORD=comicflow123
      - POSTGRES_DB=comicflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comicflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────── Redis ───────────────
  redis:
    image: redis:7-alpine
    container_name: comicflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────── MinIO (Object Storage) ───────────────
  minio:
    image: minio/minio:latest
    container_name: comicflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ─────────────── Nginx (Reverse Proxy) ───────────────
  nginx:
    image: nginx:alpine
    container_name: comicflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
